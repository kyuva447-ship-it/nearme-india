<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="33%" stop-color="#FF9933" /> <!-- Saffron -->
      <stop offset="66%" stop-color="#FFFFFF" /> <!-- White -->
      <stop offset="100%" stop-color="#138808" /> <!-- Green -->
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Map Pin Body -->
  <path d="M50 5 C30 5 15 20 15 40 C15 65 50 95 50 95 C50 95 85 65 85 40 C85 20 70 5 50 5 Z"
        fill="url(#grad)"
        stroke="#000080"
        stroke-width="2"
        filter="url(#shadow)"/>

  <!-- Center Circle (Ashoka Chakra placeholder) -->
  <circle cx="50" cy="40" r="12" fill="#000080" />

  <!-- Inner White Dot (Pin Hole) -->
  <circle cx="50" cy="40" r="4" fill="#FFFFFF" />

  <!-- Radiating lines (Chakra spokes) -->
  <path d="M50 28 L50 32 M50 48 L50 52 M38 40 L42 40 M58 40 L62 40 M42 32 L44 34 M56 48 L58 50 M58 32 L56 34 M42 48 L44 50"
        stroke="#FFFFFF"
        stroke-width="1.5"
        stroke-linecap="round"/>
</svg>
