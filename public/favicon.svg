<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" /> <!-- Blue 600 -->
      <stop offset="100%" stop-color="#4F46E5" /> <!-- Indigo 600 -->
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" /> <!-- Saffron -->
      <stop offset="100%" stop-color="#E67300" />
    </linearGradient>
  </defs>

  <!-- Background Base (Clean distinct shape for visibility on all backgrounds) -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#primaryGrad)" />

  <!-- Outer Ring (White accent) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#FFFFFF" stroke-width="20" opacity="0.3" />

  <!-- Map Pin Base -->
  <path d="M256 120 C185.3 120 128 177.3 128 248 C128 344 256 424 256 424 C256 424 384 344 384 248 C384 177.3 326.7 120 256 120 Z"
        fill="#FFFFFF" />

  <!-- Inner Pin (Saffron to represent India) -->
  <path d="M256 144 C202.9 144 160 186.9 160 240 C160 312 256 380 256 380 C256 380 352 312 352 240 C352 186.9 309.1 144 256 144 Z"
        fill="url(#pinGrad)" />

  <!-- Center Dot (Navy/Ashoka Chakra Color) -->
  <circle cx="256" cy="230" r="45" fill="#000080" />
  <circle cx="256" cy="230" r="15" fill="#FFFFFF" />

  <!-- Search Glass handle subtly extending from the pin -->
  <path d="M288 262 L324 298" stroke="#000080" stroke-width="16" stroke-linecap="round" />

</svg>
